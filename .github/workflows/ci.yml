name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: build and test (LLVM 18, ${{ matrix.build-type }})
    # The compatibility contract is Linux x86-64 with Clang/LLVM 18, which Ubuntu 24.04 packages.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build-type: [Release, Debug]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Clang and LLVM 18
        # libclang-rt-18-dev carries the sanitizer runtimes the differential tests link against.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang-18 llvm-18 llvm-18-dev libclang-rt-18-dev libpolly-18-dev
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
            -DLLVM_DIR="$(llvm-config-18 --cmakedir)"
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
